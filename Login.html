<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Changarro - Iniciar Sesión</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <h2>El Changarro</h2>
                <p>Conecta con tu comunidad y compra local</p>
            </div>
            
            <!-- Formulario con redirección estática al catálogo -->
            <form onsubmit="event.preventDefault(); window.location.href='catalogo-1.html';">
                <div class="form-group">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-primary">Iniciar Sesión</button>
            </form>

            <div class="login-footer">
                <a href="#">¿Olvidaste tu contraseña?</a>
                <p>¿No tienes cuenta? <a href="catalogo-1.html">Regístrate</a></p>
            </div>
        </div>
    </div>

</body>
</html>
